name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # Без этого скрипт идёт дальше по упавшему шагу: провалившийся build
          # всё равно доходил до pm2 restart и ронял живой процесс.
          # С остановкой по ошибке деплой просто не проходит, прод остаётся на старом коде.
          script_stop: true
          script: |
            cd /var/www/jetsim
            git pull origin main
            pnpm install
            # Клиент Prisma обязан пересобираться после каждого изменения схемы:
            # postinstall-хука у нас нет, а pnpm не запускает build-скрипты
            # зависимостей — без этого шага nest start падает на несуществующих полях
            pnpm prisma generate
            pnpm build
            pm2 restart jetsim-api

      - name: Telegram notify (CD success)
        if: success()
        run: |
          TEXT="✅ <b>Завершен билд  jetsim_api</b>"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="$TEXT"

      - name: Telegram notify (CD failed)
        if: failure()
        run: |
          TEXT="❌ <b>Ошибка деплоя jetsim_api</b>"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="$TEXT"
